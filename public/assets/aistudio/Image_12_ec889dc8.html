<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><meta content="web_blank" name="shell-type"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"secondary-fixed-dim":"#48e171","background":"#f8f9ff","primary-container":"#007aba","tertiary-fixed-dim":"#a4c9fd","on-surface":"#0b1c30","on-tertiary-fixed-variant":"#204875","secondary-fixed":"#69ff8b","secondary-container":"#66fc88","on-surface-variant":"#3f4851","inverse-surface":"#213145","tertiary-fixed":"#d3e3ff","on-tertiary-container":"#fdfcff","on-secondary-container":"#00722f","primary-fixed-dim":"#94ccff","on-primary":"#ffffff","error":"#ba1a1a","inverse-on-surface":"#eaf1ff","on-secondary-fixed":"#002108","error-container":"#ffdad6","tertiary-container":"#5276a6","tertiary":"#385e8c","surface-container-high":"#dce9ff","primary":"#006195","surface-container-highest":"#d3e4fe","primary-fixed":"#cde5ff","secondary":"#006e2c","on-tertiary":"#ffffff","surface-tint":"#006398","outline":"#6f7882","on-tertiary-fixed":"#001c39","outline-variant":"#bfc7d2","surface-bright":"#f8f9ff","on-secondary-fixed-variant":"#005320","on-primary-container":"#fdfcff","surface-dim":"#cbdbf5","on-primary-fixed-variant":"#004b74","surface-variant":"#d3e4fe","surface":"#f8f9ff","on-error":"#ffffff","on-error-container":"#93000a","surface-container":"#e5eeff","on-secondary":"#ffffff","on-background":"#0b1c30","on-primary-fixed":"#001d32","surface-container-low":"#eff4ff","inverse-primary":"#94ccff","surface-container-lowest":"#ffffff"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter-dense":"0.75rem","space-xs":"0.25rem","space-md":"0.75rem","margin":"1.5rem","margin-sm":"1rem","space-sm":"0.5rem","gutter":"1rem","space-lg":"1.25rem","space-xl":"1.75rem"},"fontFamily":{"body-sm":["Be Vietnam Pro"],"headline-xl":["Be Vietnam Pro"],"headline-sm":["Be Vietnam Pro"],"code-sm":["Inter"],"label-md":["Inter"],"headline-lg":["Be Vietnam Pro"],"body-md":["Be Vietnam Pro"],"body-lg":["Be Vietnam Pro"],"headline-md":["Be Vietnam Pro"],"label-sm":["Inter"]},"fontSize":{"body-sm":["13px",{"lineHeight":"18px","fontWeight":"400"}],"headline-xl":["30px",{"lineHeight":"38px","fontWeight":"700"}],"headline-sm":["16px",{"lineHeight":"24px","fontWeight":"600"}],"code-sm":["12px",{"lineHeight":"16px","fontWeight":"500"}],"label-md":["13px",{"lineHeight":"18px","fontWeight":"500"}],"headline-lg":["24px",{"lineHeight":"32px","fontWeight":"600"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","fontWeight":"600"}],"label-sm":["11px",{"lineHeight":"16px","fontWeight":"600"}]}}}};</script></head><body class="bg-background font-body-md text-on-surface antialiased flex items-center justify-center min-h-screen"><main class="w-full flex items-center justify-center p-gutter"><div class="flex flex-col w-full">
<div class="w-full max-w-lg mx-auto my-8 bg-surface-container-lowest rounded-xl shadow-xl overflow-hidden relative">
<!-- Left Column: Login Console -->
<div class="p-6 sm:p-10 flex flex-col bg-surface-container-lowest z-10">
<div>
<!-- Brand Header -->
<div class="flex items-center justify-between mb-8">
<img alt="KiotViet Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBx1m2FmLQxPP4mGHXOzahefd-PTWHDl-C0SGcUOPpwmIL6pLMMUDtCIuYYMDvPvORtRo4LVdqgF1ojQBdTrJuOGVqenT2x47SUq_XtwycqRz5YjvaU2X9UECuMrLtTbmUFx8c-a9e8bRaXuyysSJJqDDe6-RmgpEOR4vBOdRkrQsoYLUhPiVzbL3N0UE04kd-Rkt0q6n9I9skK9wl_VHGzAt5fSRi-oyiJt_xTybYa1W_nHWy5siqfFfkVmN567yRs9JA">
<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-primary font-label-sm text-label-sm tracking-wide">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
            PORTAL 2.4 SSO
          </span>
</div>
<!-- Headline & Welcome -->
<div class="space-y-2 mb-8">
<div class="inline-block px-2.5 py-0.5 rounded bg-primary-fixed text-primary font-label-sm text-label-sm tracking-wider uppercase">
            Hệ thống Chuyên trách CSKH
          </div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
            Trung tâm Chăm sóc khách hàng KiotViet
          </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
            Chào mừng bạn đến với hệ thống điều hành. Đăng nhập để theo dõi vận hành, chất lượng dịch vụ và hiệu suất đội ngũ.
          </p>
</div>
<!-- Role Quick Switcher Pills -->
<div class="mb-6 space-y-1.5">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">
            Vai trò vận hành mẫu (Demo Quickfill)
          </label>
<div class="flex flex-wrap gap-2">
<button class="px-2.5 py-1 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-sm text-label-sm transition-colors" onclick="setRole('cskh.leader@kiotviet.com')" type="button">
              Team Leader
            </button>
<button class="px-2.5 py-1 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-sm text-label-sm transition-colors" onclick="setRole('manager.support@kiotviet.com')" type="button">
              CC Manager
            </button>
<button class="px-2.5 py-1 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-sm text-label-sm transition-colors" onclick="setRole('admin.care@kiotviet.com')" type="button">
              System Admin
            </button>
<button class="px-2.5 py-1 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface font-label-sm text-label-sm transition-colors" onclick="setRole('qa.inspector@kiotviet.com')" type="button">
              QA Inspector
            </button>
</div>
</div>
<!-- Dynamic State Banner -->
<div class="hidden mb-6 p-3 rounded-lg flex items-start gap-3 transition-all duration-200" id="statusAlert">
<span class="material-symbols-outlined text-headline-sm select-none" id="statusIcon">error</span>
<div class="min-w-0">
<p class="font-headline-sm text-headline-sm leading-tight" id="statusTitle"></p>
<p class="font-body-sm text-body-sm mt-0.5" id="statusDesc"></p>
</div>
</div>
<!-- Login Form -->
<form class="space-y-4" id="loginForm" onsubmit="handleFormSubmit(event)">
<!-- Username / Internal Email -->
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="usernameInput">
              Tên đăng nhập hoặc Tài khoản nội bộ
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-headline-sm select-none">badge</span>
<input class="w-full h-11 pl-10 pr-3 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary transition-all" id="usernameInput" placeholder="vd: hoang.nguyen@kiotviet.com" required="" type="text" value="lam.tran@kiotviet.com">
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="passwordInput">
              Mật khẩu bảo mật
            </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline text-headline-sm select-none">lock</span>
<input class="w-full h-11 pl-10 pr-11 rounded-lg bg-surface-container-lowest text-on-surface font-body-md text-body-md shadow-sm outline-none ring-1 ring-outline-variant focus:ring-2 focus:ring-primary transition-all" id="passwordInput" placeholder="Nhập mật khẩu..." required="" type="password" value="KiotViet#2024">
<button class="absolute right-3 p-1 text-outline hover:text-on-surface transition-colors" id="togglePasswordBtn" onclick="togglePassword()" title="Hiện/Ẩn mật khẩu" type="button">
<span class="material-symbols-outlined text-headline-sm" id="eyeIcon">visibility</span>
</button>
</div>
</div>
<!-- Options row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary focus:ring-primary accent-primary cursor-pointer" type="checkbox">
<span class="font-body-sm text-body-sm text-on-surface">Ghi nhớ đăng nhập trên thiết bị này</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container font-medium hover:underline" href="javascript:void(0)" onclick="simulateForgotPassword()">
              Quên mật khẩu?
            </a>
</div>
<!-- Primary Login Button -->
<button class="w-full h-11 rounded-lg bg-primary hover:bg-primary-container active:scale-[0.99] text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-2 transition-all shadow-md hover:shadow-lg mt-2 cursor-pointer" id="submitBtn" type="submit">
<span class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin" id="submitSpinner"></span>
<span id="submitText" class="">Đăng nhập</span>
<span class="material-symbols-outlined text-headline-sm" id="submitArrow">arrow_forward</span>
</button>
</form>
<!-- Interactive Prototype State Controls -->

</div>
<!-- Security Notice Footer -->

</div>
<!-- Right Column: Branded Metrics & Operations Visualization -->

</div>
</div>
<script>
  function togglePassword() {
    const input = document.getElementById('passwordInput');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function setRole(email) {
    const userInput = document.getElementById('usernameInput');
    userInput.value = email;
    setStateNormal();
  }

  function simulateForgotPassword() {
    const alertBox = document.getElementById('statusAlert');
    const icon = document.getElementById('statusIcon');
    const title = document.getElementById('statusTitle');
    const desc = document.getElementById('statusDesc');

    alertBox.className = "mb-6 p-3 rounded-lg flex items-start gap-3 bg-surface-container text-primary transition-all";
    icon.textContent = "help";
    icon.className = "material-symbols-outlined text-headline-sm text-primary";
    title.textContent = "Khôi phục mật khẩu";
    desc.textContent = "Vui lòng mở ứng dụng KiotViet Authenticator hoặc liên hệ Trưởng ca/IT CSKH nội bộ để tạo mã OTP đặt lại.";
    alertBox.classList.remove('hidden');
  }

  function setStateNormal() {
    const alertBox = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const submitText = document.getElementById('submitText');
    const submitArrow = document.getElementById('submitArrow');

    alertBox.classList.add('hidden');
    submitBtn.disabled = false;
    submitSpinner.classList.add('hidden');
    submitArrow.classList.remove('hidden');
    submitText.textContent = "Đăng nhập";
  }

  function setStateLoading() {
    const alertBox = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const submitText = document.getElementById('submitText');
    const submitArrow = document.getElementById('submitArrow');

    alertBox.className = "mb-6 p-3 rounded-lg flex items-start gap-3 bg-primary-fixed text-primary transition-all";
    document.getElementById('statusIcon').textContent = "hourglass_top";
    document.getElementById('statusIcon').className = "material-symbols-outlined text-headline-sm text-primary animate-spin";
    document.getElementById('statusTitle').textContent = "Đang xác thực thông tin...";
    document.getElementById('statusDesc').textContent = "Đang kết nối cổng chứng thực phân quyền Active Directory / SSO KiotViet.";
    alertBox.classList.remove('hidden');

    submitBtn.disabled = true;
    submitSpinner.classList.remove('hidden');
    submitArrow.classList.add('hidden');
    submitText.textContent = "Đang xử lý...";
  }

  function setStateError() {
    const alertBox = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const submitText = document.getElementById('submitText');
    const submitArrow = document.getElementById('submitArrow');

    alertBox.className = "mb-6 p-3 rounded-lg flex items-start gap-3 bg-error-container text-on-error-container transition-all";
    document.getElementById('statusIcon').textContent = "warning";
    document.getElementById('statusIcon').className = "material-symbols-outlined text-headline-sm text-error";
    document.getElementById('statusTitle').textContent = "Lỗi sai thông tin đăng nhập";
    document.getElementById('statusDesc').textContent = "Tài khoản hoặc mật khẩu không chính xác. Bạn còn 3 lần thử trước khi bị khóa tạm thời.";
    alertBox.classList.remove('hidden');

    submitBtn.disabled = false;
    submitSpinner.classList.add('hidden');
    submitArrow.classList.remove('hidden');
    submitText.textContent = "Đăng nhập lại";
  }

  function setStateSuccess() {
    const alertBox = document.getElementById('statusAlert');
    const submitBtn = document.getElementById('submitBtn');
    const submitSpinner = document.getElementById('submitSpinner');
    const submitText = document.getElementById('submitText');
    const submitArrow = document.getElementById('submitArrow');

    alertBox.className = "mb-6 p-3 rounded-lg flex items-start gap-3 bg-secondary-container/30 text-on-secondary-container transition-all";
    document.getElementById('statusIcon').textContent = "check_circle";
    document.getElementById('statusIcon').className = "material-symbols-outlined text-headline-sm text-secondary";
    document.getElementById('statusTitle').textContent = "Đăng nhập thành công!";
    document.getElementById('statusDesc').textContent = "Đang chuyển hướng về Bàn làm việc Điều hành CSKH KiotViet...";
    alertBox.classList.remove('hidden');

    submitBtn.disabled = true;
    submitSpinner.classList.add('hidden');
    submitArrow.classList.add('hidden');
    submitText.textContent = "Đang mở Dashboard...";
  }

  function handleFormSubmit(e) {
    e.preventDefault();
    setStateLoading();
    setTimeout(() => {
      setStateSuccess();
    }, 1200);
  }
</script></main>

</body></html>
